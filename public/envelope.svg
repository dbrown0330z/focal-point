<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img">
  <title>Request an account</title>
  <g transform="translate(200, 130)" fill="none" stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Envelope body -->
    <path d="M-90,50 C-92,50 -91,-38 -89,-40 C-40,-44 40,-44 89,-40 C91,-38 92,50 90,50 C42,55 -42,55 -90,50Z" stroke-width="2"/>
    <path d="M-88,49 C-90,49 -89,-36 -87,-39 C-38,-43 38,-43 87,-39 C89,-36 90,49 88,49" stroke-width="0.6" stroke="rgba(26,26,26,0.25)"/>
    <!-- Envelope flap -->
    <path d="M-89,-40 C-50,-6 -10,20 0,22 C10,20 50,-6 89,-40" stroke-width="1.8"/>
    <path d="M-89,-40 C-60,-28 -30,-18 0,22 C30,-18 60,-28 89,-40" stroke-width="0.6" stroke="rgba(26,26,26,0.25)"/>
    <!-- Bottom crease -->
    <path d="M-90,50 C-50,18 -10,-4 0,-2 C10,-4 50,18 90,50" stroke-width="1.4" stroke="rgba(26,26,26,0.25)" opacity="0.5"/>
    <!-- Letter sticking out -->
    <rect x="-44" y="-72" width="88" height="58" rx="3" stroke-width="1.6"/>
    <!-- Lines on letter -->
    <line x1="-30" y1="-58" x2="30" y2="-59" stroke-width="1" stroke="rgba(26,26,26,0.25)"/>
    <line x1="-30" y1="-48" x2="30" y2="-49" stroke-width="1" stroke="rgba(26,26,26,0.25)"/>
    <line x1="-30" y1="-38" x2="20" y2="-39" stroke-width="1" stroke="rgba(26,26,26,0.25)"/>
    <!-- Wax seal -->
    <circle cx="0" cy="-26" r="8" stroke-width="1.4" opacity="0.6"/>
    <path d="M-3,-26 L0,-30 L3,-26 L0,-22Z" stroke-width="1" opacity="0.6"/>
    <!-- Sparkle left -->
    <line x1="-100" y1="-20" x2="-100" y2="-28" stroke-width="1.2" opacity="0.5"/>
    <line x1="-104" y1="-24" x2="-96" y2="-24" stroke-width="1.2" opacity="0.5"/>
    <line x1="-102" y1="-20" x2="-98" y2="-28" stroke-width="0.9" opacity="0.4"/>
    <line x1="-98" y1="-20" x2="-102" y2="-28" stroke-width="0.9" opacity="0.4"/>
    <!-- Sparkle right -->
    <line x1="106" y1="10" x2="106" y2="18" stroke-width="1.2" opacity="0.4"/>
    <line x1="102" y1="14" x2="110" y2="14" stroke-width="1.2" opacity="0.4"/>
    <line x1="104" y1="10" x2="108" y2="18" stroke-width="0.9" opacity="0.35"/>
    <!-- Hatch shadow -->
    <line x1="-80" y1="28" x2="-72" y2="44" stroke-width="0.8" stroke="rgba(26,26,26,0.10)"/>
    <line x1="-70" y1="26" x2="-62" y2="44" stroke-width="0.8" stroke="rgba(26,26,26,0.10)"/>
    <line x1="-60" y1="25" x2="-52" y2="44" stroke-width="0.8" stroke="rgba(26,26,26,0.10)"/>
    <!-- Heart on envelope -->
    <path d="M30,18 C30,14 34,12 36,16 C38,12 42,14 42,18 C42,22 36,28 36,28 C36,28 30,22 30,18Z" stroke-width="1.3" opacity="0.55"/>
  </g>
</svg>
