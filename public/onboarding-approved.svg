<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img">
  <title>Application approved</title>
  <desc>Hand-drawn camera with rosette award badge and celebration marks — used on the application approved page</desc>

  <style>
    :root {
      --ink: #E8E8E8;
      --ink-light: rgba(232,232,232,0.25);
      --ink-faint: rgba(232,232,232,0.10);
    }
    .sk {
      stroke: var(--ink);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <g transform="translate(200, 140)" class="sk">
    <!-- Rosette ribbon tails -->
    <path d="M-120,20 C-118,26 -124,34 -126,40 C-120,38 -114,42 -112,48 C-110,44 -104,44 -100,48 C-100,42 -96,38 -90,40 C-92,34 -98,26 -96,20" stroke-width="1.6" opacity="0.8"/>
    <!-- Rosette outer ring -->
    <circle cx="-108" cy="4" r="28" stroke-width="1.8"/>
    <circle cx="-108" cy="4" r="28" fill="var(--ink-faint)" stroke="none"/>
    <circle cx="-108" cy="4" r="20" stroke-width="1.2" opacity="0.5"/>
    <circle cx="-108" cy="4" r="12" stroke-width="1" opacity="0.4"/>
    <!-- Rosette petals -->
    <path d="M-108,-28 L-110,-20 L-106,-20 Z" stroke-width="0.9" opacity="0.5"/>
    <path d="M-108,36 L-110,28 L-106,28 Z" stroke-width="0.9" opacity="0.5"/>
    <path d="M-136,4 L-128,2 L-128,6 Z" stroke-width="0.9" opacity="0.5"/>
    <path d="M-80,4 L-88,2 L-88,6 Z" stroke-width="0.9" opacity="0.5"/>
    <path d="M-128,-20 L-122,-14 L-118,-18 Z" stroke-width="0.9" opacity="0.5"/>
    <path d="M-88,-20 L-94,-14 L-98,-18 Z" stroke-width="0.9" opacity="0.5"/>
    <path d="M-128,28 L-122,22 L-118,26 Z" stroke-width="0.9" opacity="0.5"/>
    <path d="M-88,28 L-94,22 L-98,26 Z" stroke-width="0.9" opacity="0.5"/>
    <!-- Star inside rosette -->
    <path d="M-108,-8 L-104,0 L-96,0 L-102,6 L-100,14 L-108,10 L-116,14 L-114,6 L-120,0 L-112,0 Z" stroke-width="1.3"/>
    <!-- Camera body -->
    <path d="M-44,38 C-46,37 -46,-22 -44,-24 C-14,-28 14,-28 44,-24 C46,-22 46,37 44,38 C14,43 -14,43 -44,38Z" stroke-width="2"/>
    <path d="M-42,37 C-44,36 -44,-20 -42,-23 C-12,-27 12,-27 42,-23 C44,-20 44,36 42,37" stroke-width="0.6" stroke="var(--ink-light)"/>
    <!-- Viewfinder hump -->
    <path d="M-14,-24 C-15,-34 -9,-40 0,-40 C9,-40 15,-34 14,-24" stroke-width="1.8"/>
    <path d="M-12,-24 C-13,-32 -8,-38 0,-38 C8,-38 13,-32 12,-24" stroke-width="0.5" stroke="var(--ink-light)"/>
    <!-- Lens outer -->
    <path d="M18,-3 C18,-22 -18,-22 -18,-3 C-18,16 18,16 18,-3Z" stroke-width="2"/>
    <path d="M16,-3 C16,-20 -16,-20 -16,-3 C-16,14 16,14 16,-3Z" stroke-width="0.5" stroke="var(--ink-light)"/>
    <!-- Lens inner -->
    <circle cx="0" cy="-3" r="9" stroke-width="1.4"/>
    <circle cx="0" cy="-3" r="4" stroke-width="1" opacity="0.6"/>
    <!-- Lens highlight -->
    <path d="M-10,-14 C-8,-17 -4,-17 -6,-12" stroke-width="1" opacity="0.35"/>
    <!-- Flash -->
    <rect x="24" y="-20" width="12" height="8" rx="2" stroke-width="1.4"/>
    <!-- Shutter button -->
    <ellipse cx="-30" cy="-26" rx="5" ry="3" stroke-width="1.4"/>
    <!-- Celebration marks -->
    <line x1="50" y1="-30" x2="56" y2="-22" stroke-width="1.4" opacity="0.5"/>
    <line x1="58" y1="-28" x2="52" y2="-20" stroke-width="0.8" opacity="0.3"/>
    <line x1="60" y1="-10" x2="68" y2="-6" stroke-width="1.2" opacity="0.45"/>
    <line x1="54" y1="20" x2="62" y2="26" stroke-width="1.3" opacity="0.45"/>
    <line x1="50" y1="32" x2="46" y2="40" stroke-width="1.2" opacity="0.4"/>
    <circle cx="64" cy="4" r="2.5" stroke-width="1.2" opacity="0.45"/>
    <circle cx="56" cy="36" r="2" stroke-width="1.1" opacity="0.4"/>
    <circle cx="-50" cy="36" r="2" stroke-width="1.1" opacity="0.4"/>
    <!-- Hatch shading on body -->
    <line x1="-38" y1="10" x2="-32" y2="28" stroke-width="0.7" stroke="var(--ink-faint)"/>
    <line x1="-32" y1="8" x2="-26" y2="28" stroke-width="0.7" stroke="var(--ink-faint)"/>
    <!-- Checkmark approval -->
    <path d="M24,32 C28,40 36,50 48,38" stroke-width="2.2" opacity="0.6"/>
    <path d="M26,34 C30,42 36,50 48,38" stroke-width="0.6" stroke="var(--ink-light)"/>
  </g>
</svg>
