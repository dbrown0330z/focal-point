<svg xmlns="http://www.w3.org/2000/svg" width="220" height="180" viewBox="0 0 220 180" fill="none">
  <!-- Camera body -->
  <rect x="20" y="48" width="180" height="118" rx="14" fill="#BDD4E7" />

  <!-- Viewfinder bump on top -->
  <rect x="72" y="30" width="52" height="24" rx="7" fill="#BDD4E7" />

  <!-- Top-right button/flash -->
  <rect x="152" y="34" width="24" height="16" rx="5" fill="#A8BDD4" />

  <!-- Lens outer ring -->
  <circle cx="110" cy="107" r="38" fill="#A8BDD4" />
  <!-- Lens mid ring -->
  <circle cx="110" cy="107" r="28" fill="#C8DAEC" />
  <!-- Lens inner ring -->
  <circle cx="110" cy="107" r="18" fill="#A8BDD4" />
  <!-- Lens center -->
  <circle cx="110" cy="107" r="10" fill="#BDD4E7" />

  <!-- Viewfinder small square on body top-left -->
  <rect x="34" y="60" width="18" height="14" rx="3" fill="#A8BDD4" />

  <!-- Card / ticket element overlapping bottom-left -->
  <rect x="8" y="118" width="72" height="52" rx="8" fill="#D8E8F4" stroke="#A8BDD4" stroke-width="1.5" />
  <!-- Card lines -->
  <rect x="18" y="130" width="40" height="4" rx="2" fill="#A8BDD4" />
  <rect x="18" y="140" width="30" height="4" rx="2" fill="#A8BDD4" />
  <rect x="18" y="150" width="36" height="4" rx="2" fill="#A8BDD4" />
</svg>
