<svg xmlns="http://www.w3.org/2000/svg" width="520" height="160" viewBox="0 0 680 200" role="img">
  <title>Competition submissions closed</title>
  <desc>Hand-drawn camera with lens cap sitting beside it and a closed tag on the strap — used when a competition submission window has closed</desc>

  <style>
    :root {
      --ink: #1a1a1a;
      --ink-light: rgba(26,26,26,0.25);
      --ink-faint: rgba(26,26,26,0.08);
    }
    .sk {
      stroke: var(--ink);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <g transform="translate(300, 100)" class="sk">

    <!-- ── Camera body ── -->
    <path d="M-82,36 C-84,35 -84,-26 -82,-28 C-44,-32 44,-32 82,-28 C84,-26 84,35 82,36 C44,41 -44,41 -82,36Z" stroke-width="2.2"/>
    <path d="M-80,35 C-82,34 -82,-24 -80,-27 C-42,-31 42,-31 80,-27 C82,-24 82,34 80,35" stroke-width="0.6" stroke="var(--ink-light)"/>
    <!-- Viewfinder hump -->
    <path d="M-22,-28 C-23,-40 -14,-46 0,-46 C14,-46 23,-40 22,-28" stroke-width="2"/>
    <path d="M-20,-28 C-21,-39 -13,-44 0,-44 C13,-44 21,-39 20,-28" stroke-width="0.55" stroke="var(--ink-light)"/>
    <!-- Flash -->
    <rect x="32" y="-24" width="16" height="10" rx="2" stroke-width="1.5"/>
    <!-- Shutter button -->
    <ellipse cx="-66" cy="-30" rx="6" ry="4" stroke-width="1.5"/>
    <!-- Strap lugs -->
    <rect x="-86" y="2" width="7" height="9" rx="2" stroke-width="1.3"/>
    <rect x="79" y="2" width="7" height="9" rx="2" stroke-width="1.3"/>
    <!-- Hatch shading -->
    <line x1="-72" y1="14" x2="-66" y2="30" stroke-width="0.8" opacity="0.14"/>
    <line x1="-66" y1="13" x2="-60" y2="30" stroke-width="0.8" opacity="0.14"/>
    <line x1="-60" y1="12" x2="-54" y2="30" stroke-width="0.8" opacity="0.14"/>

    <!-- ── Empty lens barrel ── -->
    <ellipse cx="0" cy="4" rx="28" ry="27" stroke-width="2"/>
    <ellipse cx="0" cy="4" rx="28" ry="27" fill="var(--ink)" stroke="none" opacity="0.04"/>
    <ellipse cx="0" cy="4" rx="20" ry="19" stroke-width="1.3" opacity="0.5"/>
    <ellipse cx="0" cy="4" rx="12" ry="11" stroke-width="1.1" opacity="0.35"/>
    <ellipse cx="0" cy="4" rx="6" ry="6" fill="var(--ink)" stroke="none" opacity="0.12"/>
    <ellipse cx="0" cy="4" rx="6" ry="6" stroke-width="1" opacity="0.4"/>
    <!-- Empty barrel cross hatch -->
    <line x1="-10" y1="-4" x2="10" y2="12" stroke-width="0.8" opacity="0.18"/>
    <line x1="10" y1="-4" x2="-10" y2="12" stroke-width="0.8" opacity="0.18"/>

    <!-- ── Lens cap — leaning beside camera ── -->
    <g transform="translate(118, 8)">
      <ellipse cx="0" cy="0" rx="24" ry="23" stroke-width="2.2" transform="rotate(-8)"/>
      <ellipse cx="0" cy="0" rx="24" ry="23" fill="var(--ink)" stroke="none" opacity="0.06" transform="rotate(-8)"/>
      <ellipse cx="0" cy="0" rx="24" ry="23" stroke-width="0.6" stroke="var(--ink-light)" transform="translate(1,1) rotate(-8)"/>
      <ellipse cx="0" cy="0" rx="14" ry="13" stroke-width="1.4" opacity="0.5" transform="rotate(-8)"/>
      <!-- Grip ridges top -->
      <line x1="-10" y1="-22" x2="-6" y2="-24" stroke-width="1.4" opacity="0.5" transform="rotate(-8)"/>
      <line x1="-3" y1="-23" x2="1" y2="-24" stroke-width="1.4" opacity="0.5" transform="rotate(-8)"/>
      <line x1="4" y1="-23" x2="8" y2="-22" stroke-width="1.4" opacity="0.5" transform="rotate(-8)"/>
      <!-- Grip ridges bottom -->
      <line x1="-10" y1="22" x2="-6" y2="24" stroke-width="1.4" opacity="0.5" transform="rotate(-8)"/>
      <line x1="-3" y1="23" x2="1" y2="24" stroke-width="1.4" opacity="0.5" transform="rotate(-8)"/>
      <line x1="4" y1="23" x2="8" y2="22" stroke-width="1.4" opacity="0.5" transform="rotate(-8)"/>
      <!-- Highlight glint -->
      <path d="M-16,-10 C-14,-16 -8,-16 -10,-8" stroke-width="1" opacity="0.3" transform="rotate(-8)"/>
      <!-- Hatch on face -->
      <line x1="-8" y1="2" x2="-4" y2="14" stroke-width="0.8" opacity="0.13"/>
      <line x1="-4" y1="0" x2="0" y2="14" stroke-width="0.8" opacity="0.13"/>
      <!-- Label squiggle lines -->
      <line x1="-8" y1="-4" x2="8" y2="-5" stroke-width="0.9" opacity="0.2"/>
      <line x1="-8" y1="2" x2="6" y2="1" stroke-width="0.9" opacity="0.2"/>
      <!-- Floor lean shadow -->
      <line x1="-20" y1="26" x2="24" y2="30" stroke-width="1" opacity="0.2"/>
      <!-- Dashed connector to camera -->
      <path d="M-120,4 C-80,4 -50,2 -26,2" stroke-width="1.1" opacity="0.2" stroke-dasharray="3 2.5"/>
    </g>

    <!-- ── Closed tag hanging from left strap lug ── -->
    <g transform="translate(-118, 18)">
      <!-- String -->
      <path d="M22,-10 C18,0 14,10 12,20" stroke-width="1.2" opacity="0.55"/>
      <!-- Tag body -->
      <path d="M-14,20 C-16,19 -16,58 -14,60 C-4,63 18,63 24,60 C26,58 26,19 24,20 C18,17 -4,17 -14,20Z" stroke-width="1.6"/>
      <path d="M-12,21 C-14,20 -14,57 -12,59 C-2,62 16,62 22,59 C24,57 24,20 22,21" stroke-width="0.5" stroke="var(--ink-light)"/>
      <!-- Hole punch -->
      <circle cx="5" cy="22" r="3" stroke-width="1.2" opacity="0.6"/>
      <!-- Ruled lines -->
      <line x1="-8" y1="34" x2="18" y2="34" stroke-width="1.1" opacity="0.4"/>
      <line x1="-8" y1="42" x2="18" y2="42" stroke-width="1.1" opacity="0.4"/>
      <line x1="-8" y1="50" x2="14" y2="50" stroke-width="1.1" opacity="0.4"/>
      <!-- X on tag -->
      <line x1="-4" y1="30" x2="14" y2="54" stroke-width="1" opacity="0.22"/>
      <line x1="14" y1="30" x2="-4" y2="54" stroke-width="1" opacity="0.22"/>
    </g>

    <!-- Ground line -->
    <line x1="-200" y1="80" x2="220" y2="80" stroke-width="1.2" opacity="0.18"/>
    <ellipse cx="50" cy="80" rx="100" ry="6" fill="var(--ink)" stroke="none" opacity="0.04"/>

  </g>
</svg>
