<svg xmlns="http://www.w3.org/2000/svg" width="520" height="180" viewBox="0 0 680 220" role="img">
  <title>No competition submissions yet</title>
  <desc>Hand-drawn easel with blank canvas flanked by three numbered entry slots — used on the competition submission area when no images have been added</desc>

  <style>
    :root {
      --ink: #1a1a1a;
      --ink-light: rgba(26,26,26,0.25);
      --ink-faint: rgba(26,26,26,0.08);
    }
    .sk {
      stroke: var(--ink);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <g transform="translate(340, 108)">

    <!-- ══ EASEL ══ -->
    <g class="sk">
      <!-- Left leg -->
      <path d="M-4,62 C-6,64 -34,90 -38,98" stroke-width="2"/>
      <path d="M-2,62 C-4,64 -32,90 -36,98" stroke-width="0.55" stroke="var(--ink-light)"/>
      <!-- Right leg -->
      <path d="M4,62 C6,64 34,90 38,98" stroke-width="2"/>
      <path d="M6,62 C8,64 36,90 40,98" stroke-width="0.55" stroke="var(--ink-light)"/>
      <!-- Back brace leg -->
      <path d="M0,62 C2,72 10,88 14,98" stroke-width="1.5" opacity="0.5"/>
      <!-- Cross brace -->
      <line x1="-24" y1="80" x2="10" y2="86" stroke-width="1.3" opacity="0.45"/>
      <!-- Hinge pin -->
      <circle cx="0" cy="60" r="3.5" stroke-width="1.3" opacity="0.6"/>
      <!-- Painting shelf / ledge -->
      <path d="M-46,44 C-47,43 -46,48 -45,50 C-14,53 14,53 45,50 C46,48 47,43 46,44 C14,41 -14,41 -46,44Z" stroke-width="1.6"/>
      <!-- Canvas frame -->
      <path d="M-42,-54 C-44,-55 -43,40 -42,42 C-14,45 14,45 42,42 C43,40 44,-55 42,-54 C14,-57 -14,-57 -42,-54Z" stroke-width="2"/>
      <path d="M-40,-53 C-42,-54 -41,39 -40,41 C-12,44 12,44 40,41 C41,39 42,-53 40,-53" stroke-width="0.55" stroke="var(--ink-light)"/>
      <!-- Inner canvas area -->
      <rect x="-34" y="-46" width="68" height="82" rx="2" stroke-width="1.2" opacity="0.45"/>
      <!-- X placeholder on canvas -->
      <line x1="-34" y1="-46" x2="34" y2="36" stroke-width="1" opacity="0.18"/>
      <line x1="34" y1="-46" x2="-34" y2="36" stroke-width="1" opacity="0.18"/>
      <!-- Leg hatch shading -->
      <line x1="-32" y1="86" x2="-28" y2="96" stroke-width="0.8" opacity="0.13"/>
      <line x1="-28" y1="85" x2="-24" y2="96" stroke-width="0.8" opacity="0.13"/>
    </g>

    <!-- ══ SLOT 1 — left of easel ══ -->
    <g class="sk">
      <!-- Card body -->
      <path d="M-190,-50 C-192,-51 -192,-20 -190,-18 C-168,-15 -128,-15 -106,-18 C-104,-20 -104,-51 -106,-50 C-128,-47 -168,-47 -190,-50Z" stroke-width="1.7"/>
      <path d="M-188,-49 C-190,-50 -190,-21 -188,-19 C-166,-16 -130,-16 -108,-19 C-106,-21 -106,-49 -108,-49" stroke-width="0.5" stroke="var(--ink-light)"/>
      <!-- Number circle -->
      <circle cx="-174" cy="-34" r="8.5" stroke-width="1.3"/>
      <circle cx="-174" cy="-34" r="8.5" fill="var(--ink)" stroke="none" opacity="0.05"/>
      <!-- Placeholder lines -->
      <line x1="-158" y1="-42" x2="-116" y2="-43" stroke-width="1" opacity="0.2"/>
      <line x1="-158" y1="-34" x2="-120" y2="-35" stroke-width="1" opacity="0.2"/>
      <line x1="-158" y1="-26" x2="-126" y2="-27" stroke-width="1" opacity="0.2"/>
    </g>
    <text x="-174" y="-30" text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="11" fill="var(--ink)" opacity="0.45">1</text>

    <!-- Slot 1 thumbnail -->
    <g class="sk">
      <rect x="-190" y="-8" width="84" height="54" rx="3" stroke-width="1.5" opacity="0.5"/>
      <line x1="-190" y1="-8" x2="-106" y2="46" stroke-width="0.8" opacity="0.15"/>
      <line x1="-106" y1="-8" x2="-190" y2="46" stroke-width="0.8" opacity="0.15"/>
      <!-- Sketchy landscape inside thumbnail -->
      <path d="M-182,34 L-168,14 L-158,24 L-148,10 L-116,34Z" stroke-width="1.1" opacity="0.25"/>
      <circle cx="-122" cy="6" r="5" stroke-width="1" opacity="0.25"/>
    </g>

    <!-- Dashed connector: slot 1 → easel -->
    <line x1="-106" y1="20" x2="-48" y2="20" class="sk" stroke-width="1.1" opacity="0.28" stroke-dasharray="3 2.5"/>

    <!-- ══ SLOT 2 — right of easel ══ -->
    <g class="sk">
      <path d="M106,-50 C104,-51 104,-20 106,-18 C128,-15 168,-15 190,-18 C192,-20 192,-51 190,-50 C168,-47 128,-47 106,-50Z" stroke-width="1.7"/>
      <path d="M108,-49 C106,-50 106,-21 108,-19 C130,-16 166,-16 188,-19 C190,-21 190,-49 188,-49" stroke-width="0.5" stroke="var(--ink-light)"/>
      <circle cx="120" cy="-34" r="8.5" stroke-width="1.3"/>
      <circle cx="120" cy="-34" r="8.5" fill="var(--ink)" stroke="none" opacity="0.05"/>
      <line x1="136" y1="-42" x2="178" y2="-43" stroke-width="1" opacity="0.2"/>
      <line x1="136" y1="-34" x2="174" y2="-35" stroke-width="1" opacity="0.2"/>
      <line x1="136" y1="-26" x2="170" y2="-27" stroke-width="1" opacity="0.2"/>
    </g>
    <text x="120" y="-30" text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="11" fill="var(--ink)" opacity="0.45">2</text>

    <!-- Slot 2 thumbnail — blank -->
    <g class="sk">
      <rect x="106" y="-8" width="84" height="54" rx="3" stroke-width="1.5" opacity="0.5"/>
      <line x1="106" y1="-8" x2="190" y2="46" stroke-width="0.8" opacity="0.15"/>
      <line x1="190" y1="-8" x2="106" y2="46" stroke-width="0.8" opacity="0.15"/>
    </g>

    <!-- ══ SLOT 3 — dashed / ghosted ══ -->
    <g class="sk">
      <path d="M106,54 C104,53 104,76 106,78 C128,81 168,81 190,78 C192,76 192,53 190,54 C168,57 128,57 106,54Z" stroke-width="1.4" stroke-dasharray="4 2.5" opacity="0.4"/>
      <circle cx="120" cy="66" r="8.5" stroke-width="1.2" opacity="0.35"/>
      <line x1="136" y1="60" x2="178" y2="59" stroke-width="1" opacity="0.15"/>
      <line x1="136" y1="68" x2="174" y2="67" stroke-width="1" opacity="0.15"/>
    </g>
    <text x="120" y="70" text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="11" fill="var(--ink)" opacity="0.28">3</text>

    <!-- Dashed connector: slot 2 → easel -->
    <line x1="106" y1="20" x2="48" y2="20" class="sk" stroke-width="1.1" opacity="0.28" stroke-dasharray="3 2.5"/>

    <!-- ══ GROUND LINE ══ -->
    <line x1="-220" y1="100" x2="220" y2="100" class="sk" stroke-width="1.1" opacity="0.18"/>
    <!-- Floor shadow -->
    <ellipse cx="8" cy="100" rx="44" ry="5" fill="var(--ink)" stroke="none" opacity="0.05"/>

  </g>
</svg>
