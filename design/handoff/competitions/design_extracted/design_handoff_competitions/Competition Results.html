// ── Computed stats ────────────────────────────────────────────────────────────
function catStats(entries){
  const scores=entries.map(e=>e.score);
  const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*10)/10;
  const min=Math.min(...scores), max=Math.max(...scores);
  const bands=[{label:'21–30',min:21,max:30},{label:'11–20',min:11,max:20},{label:'1–10',min:1,max:10}];
  return{avg,min,max,count:entries.length,bands:bands.map(b=>({...b,n:scores.filter(s=>s>=b.min&&s<=b.max).length}))};
}

// ── Score badge ───────────────────────────────────────────────────────────────
function ScoreBadge({score, max=30, rank, dark, large=false}){
  const pct=score/max;
  const color=pct>=0.8?'#D4A800':pct>=0.67?dark?T.successTxtDk:T.success:'#7E8EA3';
  const bg=pct>=0.8?(dark?T.goldBg:'rgba(184,134,11,0.10)'):pct>=0.67?(dark?T.successBgDk:T.successBg):(dark?'rgba(126,142,163,0.12)':'rgba(126,142,163,0.08)');
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,background:bg,borderRadius:10,padding:large?'10px 18px':'7px 12px',minWidth:large?72:52}}>
      <span style={{fontSize:large?34:20,fontWeight:700,color,lineHeight:1,fontFamily:T.lora}}>{score}</span>
      <span style={{fontSize:large?12:10,color,opacity:0.7,fontFamily:T.nu,fontWeight:600}}>/{max}</span>
    </div>
  );
}

// ── Rank chip ─────────────────────────────────────────────────────────────────
function RankChip({rank, total, dark}){
  const c=dark?T.d:T.l;
  const medal=rank===1?{bg:'rgba(184,134,11,0.18)',color:T.goldTxtDk,label:'1st'}
             :rank===2?{bg:T.silverBg,color:'#A0B0C0',label:'2nd'}
             :rank===3?{bg:T.bronzeBg,color:'#C49070',label:'3rd'}
             :null;
  if(medal) return <span style={{display:'inline-flex',alignItems:'center',padding:'2px 9px',borderRadius:9999,fontSize:12,fontWeight:700,background:medal.bg,color:medal.color,fontFamily:T.nu}}>★ {medal.label}</span>;
  return <span style={{fontSize:13,color:c.t2,fontFamily:T.nu,fontWeight:500}}>{rank} of {total}</span>;
}

// ── Mini distribution bar ─────────────────────────────────────────────────────
function DistBar({entries, dark}){
  const c=dark?T.d:T.l;
  const total=entries.length;
  const bands=[
    {label:'21–30',min:21,max:30,color:dark?T.goldTxtDk:'#B8860B'},
    {label:'11–20',min:11,max:20,color:dark?'#4A90D4':'#1A6FC4'},
    {label:'1–10', min:1, max:10, color:dark?c.t3:'#AAA'},
  ];
  return(
    <div style={{display:'flex',flexDirection:'column',gap:6}}>
      {bands.map(b=>{
        const n=entries.filter(e=>e.score>=b.min&&e.score<=b.max).length;
        const pct=total>0?n/total:0;
        return(
          <div key={b.label} style={{display:'grid',gridTemplateColumns:'44px 1fr 24px',alignItems:'center',gap:8}}>
            <span style={{fontSize:11,fontWeight:600,color:c.t3,fontFamily:T.nu,textAlign:'right'}}>{b.label}</span>
            <div style={{height:10,background:dark?T.d.s3:T.l.s1,borderRadius:9999,overflow:'hidden'}}>
              <div style={{height:'100%',width:`${pct*100}%`,background:b.color,borderRadius:9999,transition:'width 0.5s ease'}}/>
            </div>
            <span style={{fontSize:12,fontWeight:700,color:c.t2,fontFamily:T.nu}}>{n}</span>
          </div>
        );
      })}
    </div>
  );
}

// ── Category bar chart (avg scores) ──────────────────────────────────────────
function CatAvgBars({dark}){
  const c=dark?T.d:T.l;
  const cats=COMP.categories.map(cat=>{
    const entries=ALL_ENTRIES[cat]||[];
    const avg=entries.length?Math.round(entries.reduce((a,b)=>a+b.score,0)/entries.length*10)/10:0;
    return{cat,avg,count:entries.length};
  });
  const maxAvg=30;
  return(
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      {cats.map(({cat,avg,count})=>(
        <div key={cat} style={{display:'grid',gridTemplateColumns:'72px 1fr 38px',alignItems:'center',gap:10}}>
          <span style={{fontSize:13,fontWeight:500,color:c.t2,fontFamily:T.nu,textAlign:'right'}}>{cat}</span>
          <div style={{height:12,background:dark?T.d.s3:T.l.s1,borderRadius:9999,overflow:'hidden',position:'relative'}}>
            <div style={{height:'100%',width:`${avg/maxAvg*100}%`,background:c.ac,borderRadius:9999,transition:'width 0.5s ease'}}/>
          </div>
          <span style={{fontSize:13,fontWeight:700,color:c.t1,fontFamily:T.nu}}>{avg}</span>
        </div>
      ))}
    </div>
  );
}

// ── My result card ────────────────────────────────────────────────────────────
function MyResultCard({entry, dark}){
  const c=dark?T.d:T.l;
  const [expanded,setExpanded]=React.useState(false);
  const allInCat=ALL_ENTRIES[entry.cat]||[];
  const stats=catStats(allInCat);
  const aboveAvg=entry.score>stats.avg;
  return(
    <div style={{borderRadius:12,overflow:'hidden',border:`1px solid ${c.bd}`,background:dark?T.d.s2:T.l.s2,boxShadow:dark?'none':'0 2px 10px rgba(0,0,0,0.07)'}}>
      <div style={{display:'flex',gap:0}}>
        {/* Thumb */}
        <div style={{position:'relative',width:130,flexShrink:0,background:entry.grad}}>
          <img src={entry.img} alt={entry.name} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}} onError={e=>{e.target.style.display='none'}}/>
          <div style={{position:'absolute',top:8,left:8,background:'rgba(0,0,0,0.65)',color:'#fff',fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:4,fontFamily:T.nu}}>{entry.cat}</div>
        </div>
        {/* Details */}
        <div style={{flex:1,padding:'14px 18px',display:'flex',flexDirection:'column',gap:8,minWidth:0}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:15,fontWeight:700,color:c.t1,fontFamily:T.lora,lineHeight:1.35,marginBottom:5}}>{entry.name}</div>
              <RankChip rank={entry.rank} total={entry.rankOf} dark={dark}/>
            </div>
            <ScoreBadge score={entry.score} max={entry.maxScore} rank={entry.rank} dark={dark} large/>
          </div>
          {/* Contextual score line */}
          <div style={{display:'flex',flexWrap:'wrap',gap:14}}>
            <span style={{fontSize:13,color:c.t2,fontFamily:T.nu}}>
              Category avg: <strong style={{color:c.t1}}>{stats.avg}</strong>
            </span>
            <span style={{fontSize:13,color:c.t2,fontFamily:T.nu}}>
              Range: <strong style={{color:c.t1}}>{stats.min}–{stats.max}</strong>
            </span>
            <span style={{fontSize:13,fontWeight:600,fontFamily:T.nu,
              color:aboveAvg?(dark?T.successTxtDk:T.success):(dark?T.d.t3:T.l.t3)}}>
              {aboveAvg?`↑ ${Math.round((entry.score-stats.avg)*10)/10} above avg`:`${Math.round((stats.avg-entry.score)*10)/10} below avg`}
            </span>
          </div>
          {/* Feedback toggle */}
          {entry.feedback&&(
            <button onClick={()=>setExpanded(e=>!e)} style={{display:'flex',alignItems:'center',gap:6,background:'transparent',border:'none',cursor:'pointer',padding:0,color:c.ac,fontSize:13,fontWeight:600,fontFamily:T.nu,textAlign:'left'}}>
              <Icon n={expanded?'chevU':'chevD'} size={13} color={c.ac}/>
              {expanded?'Hide judge feedback':'View judge feedback'}
            </button>
          )}
        </div>
      </div>
      {/* Expanded feedback */}
      {expanded&&entry.feedback&&(
        <div style={{borderTop:`1px solid ${c.bd}`,padding:'14px 18px',background:dark?'rgba(255,255,255,0.025)':'rgba(0,0,0,0.025)',display:'flex',gap:10}}>
          <Icon n="quote" size={18} color={c.t3} style={{flexShrink:0,marginTop:2}}/>
          <p style={{fontSize:14,color:c.t2,fontFamily:T.nu,lineHeight:1.65,fontStyle:'italic'}}>{entry.feedback}</p>
        </div>
      )}
    </div>
  );
}

// ── Ranked entry row ──────────────────────────────────────────────────────────
function EntryRow({entry, rank, dark}){
  const c=dark?T.d:T.l;
  const isMine=entry.mine;
  const medal=rank===1?T.goldTxtDk:rank===2?'#A0B0C0':rank===3?'#C49070':null;
  return(
    <div style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px',
      background:isMine?(dark?'rgba(74,144,212,0.07)':'rgba(26,111,196,0.05)'):'transparent',
      borderLeft:isMine?`3px solid ${c.ac}`:'3px solid transparent',
      transition:'background 0.15s'}}>
      {/* Rank number */}
      <div style={{width:22,textAlign:'center',flexShrink:0}}>
        {medal
          ? <span style={{fontSize:14,fontWeight:700,color:medal,fontFamily:T.lora}}>★</span>
          : <span style={{fontSize:13,color:c.t3,fontFamily:T.nu,fontWeight:500}}>{rank}</span>}
      </div>
      {/* Thumb */}
      <div style={{width:48,height:36,borderRadius:6,overflow:'hidden',flexShrink:0,background:entry.grad}}>
        <img src={entry.img} alt={entry.name} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={e=>{e.target.style.display='none'}}/>
      </div>
      {/* Name + member */}
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:14,fontWeight:isMine?700:500,color:c.t1,fontFamily:T.nu,lineHeight:1.3,
          display:'-webkit-box',WebkitLineClamp:1,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{entry.name}
          {isMine&&<span style={{marginLeft:7,fontSize:11,fontWeight:700,background:dark?'rgba(74,144,212,0.18)':'rgba(26,111,196,0.12)',color:c.ac,padding:'1px 6px',borderRadius:5,fontFamily:T.nu}}>You</span>}
        </div>
        <div style={{fontSize:12,color:c.t3,fontFamily:T.nu,marginTop:1}}>{entry.member}</div>
      </div>
      {/* Score */}
      <div style={{display:'flex',alignItems:'baseline',gap:3,flexShrink:0}}>
        <span style={{fontSize:18,fontWeight:700,color:c.t1,fontFamily:T.lora}}>{entry.score}</span>
        <span style={{fontSize:12,color:c.t3,fontFamily:T.nu}}>/30</span>
      </div>
    </div>
  );
}

// ── Category section ──────────────────────────────────────────────────────────
function CategorySection({cat, entries, dark, defaultOpen=true}){
  const c=dark?T.d:T.l;
  const [open,setOpen]=React.useState(defaultOpen);
  const [sort,setSort]=React.useState('score'); // score | name | member
  const stats=catStats(entries);
  const sorted=[...entries].sort((a,b)=>sort==='score'?b.score-a.score:sort==='name'?a.name.localeCompare(b.name):a.member.localeCompare(b.member));
  const winner=sorted[0];
  return(
    <div style={{borderRadius:12,overflow:'hidden',border:`1px solid ${c.bd}`,background:dark?T.d.s1:T.l.s2,boxShadow:dark?'none':'0 2px 10px rgba(0,0,0,0.06)'}}>
      {/* Category header */}
      <button onClick={()=>setOpen(o=>!o)} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 18px',background:'transparent',border:'none',cursor:'pointer',textAlign:'left'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:16,fontWeight:700,color:c.t1,fontFamily:T.lora}}>{cat}</span>
          <span style={{fontSize:13,color:c.t3,fontFamily:T.nu}}>{entries.length} images</span>
          {/* Winner pill */}
          <span style={{fontSize:12,fontWeight:700,background:'rgba(184,134,11,0.16)',color:dark?T.goldTxtDk:T.goldBg,padding:'2px 9px',borderRadius:9999,fontFamily:T.nu}}>
            ★ {winner.member} · {winner.score}
          </span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <span style={{fontSize:13,color:c.t2,fontFamily:T.nu}}>Avg: <strong style={{color:c.t1}}>{stats.avg}</strong></span>
          <span style={{fontSize:13,color:c.t2,fontFamily:T.nu}}>Range: <strong style={{color:c.t1}}>{stats.min}–{stats.max}</strong></span>
          <Icon n={open?'chevU':'chevD'} size={16} color={c.t3}/>
        </div>
      </button>
      {open&&(
        <>
          {/* Sort bar */}
          <div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 18px 8px',borderTop:`1px solid ${c.bds}`,background:dark?T.d.s2:T.l.s1}}>
            <span style={{fontSize:12,color:c.t3,fontFamily:T.nu,marginRight:4}}>Sort:</span>
            {[['score','Score'],['name','Image name'],['member','Member']].map(([v,lbl])=>(
              <button key={v} onClick={()=>setSort(v)} style={{padding:'3px 10px',borderRadius:6,border:'none',background:sort===v?c.ac:'transparent',color:sort===v?'#fff':c.t2,fontSize:12,fontWeight:sort===v?700:500,fontFamily:T.nu,cursor:'pointer'}}>{lbl}</button>
            ))}
            {/* Distribution inline */}
            <div style={{marginLeft:'auto',display:'flex',gap:6,alignItems:'center'}}>
              {[['21–30',entries.filter(e=>e.score>=21).length,'#D4A800'],['11–20',entries.filter(e=>e.score>=11&&e.score<=20).length,c.ac],['1–10',entries.filter(e=>e.score<=10).length,c.t3]].map(([lbl,n,col])=>(
                n>0&&<span key={lbl} style={{fontSize:11,fontWeight:700,color:col,fontFamily:T.nu}}>{lbl}: {n}</span>
              ))}
            </div>
          </div>
          {/* Rows */}
          <div style={{borderTop:`1px solid ${c.bds}`}}>
            {sorted.map((entry,i)=>(
              <React.Fragment key={entry.id}>
                {i>0&&<div style={{height:1,background:c.bds,marginLeft:98}}/>}
                <EntryRow entry={entry} rank={i+1} dark={dark}/>
              </React.Fragment>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ── Stats sidebar ─────────────────────────────────────────────────────────────
function StatsSidebar({dark}){
  const c=dark?T.d:T.l;
  const allEntries=Object.values(ALL_ENTRIES).flat();
  const allScores=allEntries.map(e=>e.score);
  const overallAvg=Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length*10)/10;
  const lbl={fontSize:11,fontWeight:700,letterSpacing:'0.07em',textTransform:'uppercase',color:c.t3,fontFamily:T.nu,marginBottom:10};
  const card={background:dark?T.d.s1:T.l.s2,border:`1px solid ${c.bd}`,borderRadius:12,padding:'16px 18px',marginBottom:14,boxShadow:dark?'none':'0 2px 8px rgba(0,0,0,0.06)'};
  return(
    <div style={{width:240,flexShrink:0,display:'flex',flexDirection:'column'}}>
      {/* Your scores summary */}
      <div style={card}>
        <div style={lbl}>Your Results</div>
        {MY_ENTRIES.map(e=>(
          <div key={e.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,gap:8}}>
            <div style={{minWidth:0,flex:1}}>
              <div style={{fontSize:13,fontWeight:600,color:c.t1,fontFamily:T.nu,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.name.split('—')[0].trim()}</div>
              <div style={{fontSize:12,color:c.t3,fontFamily:T.nu,marginTop:1}}>{e.cat}</div>
            </div>
            <ScoreBadge score={e.score} max={e.maxScore} dark={dark}/>
          </div>
        ))}
        <div style={{height:1,background:c.bds,margin:'8px 0'}}/>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontFamily:T.nu}}>
          <span style={{color:c.t2}}>Your avg</span>
          <strong style={{color:c.t1}}>{Math.round(MY_ENTRIES.reduce((a,e)=>a+e.score,0)/MY_ENTRIES.length*10)/10}</strong>
        </div>
      </div>

      {/* Category averages */}
      <div style={card}>
        <div style={lbl}>Category Averages</div>
        <CatAvgBars dark={dark}/>
        <div style={{height:1,background:c.bds,margin:'12px 0'}}/>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontFamily:T.nu}}>
          <span style={{color:c.t2}}>Overall avg</span>
          <strong style={{color:c.t1}}>{overallAvg}</strong>
        </div>
      </div>

      {/* Score distribution */}
      <div style={card}>
        <div style={lbl}>Score Distribution</div>
        <DistBar entries={allEntries} dark={dark}/>
        <div style={{height:1,background:c.bds,margin:'12px 0'}}/>
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontFamily:T.nu}}>
            <span style={{color:c.t2}}>Highest score</span><strong style={{color:c.t1}}>{Math.max(...allScores)}</strong>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontFamily:T.nu}}>
            <span style={{color:c.t2}}>Lowest score</span><strong style={{color:c.t1}}>{Math.min(...allScores)}</strong>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontFamily:T.nu}}>
            <span style={{color:c.t2}}>Total entries</span><strong style={{color:c.t1}}>{allEntries.length}</strong>
          </div>
        </div>
      </div>

      {/* Judge card */}
      <div style={card}>
        <div style={lbl}>Judge</div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
          <div style={{width:38,height:38,borderRadius:'50%',background:dark?T.d.s3:T.l.s1,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:15,fontWeight:700,color:c.t2,fontFamily:T.nu}}>CW</div>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:c.t1,fontFamily:T.nu}}>{COMP.judge}</div>
            <div style={{fontSize:12,color:c.t3,fontFamily:T.nu,lineHeight:1.4}}>{COMP.judgeTitle}</div>
          </div>
        </div>
        <div style={{fontSize:13,color:c.t2,fontFamily:T.nu,lineHeight:1.55}}>
          Carol judged using NECCC standards — technical merit (40%), artistic impact (40%), subject interest (20%).
        </div>
      </div>
    </div>
  );
}

// ── Results page ──────────────────────────────────────────────────────────────
function ResultsPage({dark, onBack}){
  const c=dark?T.d:T.l;
  const [tab,setTab]=React.useState('my'); // 'my' | 'all'
  const card={background:dark?T.d.s1:T.l.s2,border:`1px solid ${c.bd}`,borderRadius:12};

  return(
    <div style={{flex:1,overflow:'auto',background:c.s0,fontFamily:T.nu}}>
      {/* Page header */}
      <div style={{background:dark?T.d.s1:'#fff',borderBottom:`1px solid ${c.bd}`,boxShadow:dark?'none':'0 1px 6px rgba(0,0,0,0.06)',padding:'16px 32px',display:'flex',alignItems:'center',gap:14,flexShrink:0,position:'sticky',top:0,zIndex:10}}>
        <button onClick={onBack} style={{display:'flex',alignItems:'center',gap:5,background:'transparent',border:'none',cursor:'pointer',color:c.ac,fontSize:14,fontWeight:600,fontFamily:T.nu,padding:0,flexShrink:0}}>
          <Icon n="chevL" size={14} color={c.ac}/>Back
        </button>
        <div style={{width:1,height:20,background:c.bd}}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.07em',textTransform:'uppercase',color:c.t3,marginBottom:1}}>Competition Results</div>
          <div style={{fontSize:17,fontWeight:700,color:c.t1,fontFamily:T.lora,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{COMP.name}</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:14,flexShrink:0}}>
          <span style={{fontSize:13,color:c.t2,fontFamily:T.nu,display:'flex',alignItems:'center',gap:5}}>
            <Icon n="cal" size={13} color={c.t3}/>{COMP.meeting}
          </span>
          <span style={{fontSize:13,color:c.t2,fontFamily:T.nu,display:'flex',alignItems:'center',gap:5}}>
            <Icon n="users" size={13} color={c.t3}/>{COMP.judge}
          </span>
          <span style={{display:'inline-flex',padding:'2px 9px',borderRadius:9999,fontSize:12,fontWeight:700,letterSpacing:'0.03em',textTransform:'uppercase',fontFamily:T.nu,background:dark?T.successBgDk:T.successBg,color:dark?T.successTxtDk:T.success}}>Results published</span>
        </div>
      </div>

      <div style={{padding:'24px 32px 48px',maxWidth:1160,margin:'0 auto'}}>
        {/* Tab bar */}
        <div style={{display:'flex',borderBottom:`1px solid ${c.bd}`,marginBottom:24}}>
          {[['my','My Results'],['all','All Results']].map(([v,lbl])=>{
            const active=tab===v;
            return(<button key={v} onClick={()=>setTab(v)} style={{padding:'10px 20px',background:'transparent',border:'none',borderBottom:active?`2px solid ${c.ac}`:'2px solid transparent',color:active?c.ac:c.t2,fontSize:15,fontWeight:active?700:500,cursor:'pointer',fontFamily:T.nu,marginBottom:'-1px',transition:'all 0.15s'}}>{lbl}</button>);
          })}
        </div>

        {/* My Results tab */}
        {tab==='my'&&(
          <div className="fade-up" style={{display:'flex',gap:24,alignItems:'flex-start'}}>
            <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:14}}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.07em',textTransform:'uppercase',color:c.t3,marginBottom:2}}>Your {MY_ENTRIES.length} submitted images</div>
              {MY_ENTRIES.map(entry=><MyResultCard key={entry.id} entry={entry} dark={dark}/>)}

              {/* How to read section */}
              <div style={{...card,padding:'16px 20px',marginTop:6}}>
                <div style={{fontSize:13,fontWeight:700,color:c.t1,marginBottom:10}}>How to read your scores</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
                  {[
                    ['21–30','Strong','Top of the range — strong technical and artistic execution'],
                    ['11–20','Solid','Good work with room to develop — typical for intermediate entries'],
                    ['1–10','Developing','Foundational work — focus on exposure, focus, and composition'],
                  ].map(([range,label,desc])=>(
                    <div key={range} style={{background:dark?T.d.s2:T.l.s1,borderRadius:8,padding:'10px 12px'}}>
                      <div style={{fontSize:14,fontWeight:700,color:c.t1,fontFamily:T.lora,marginBottom:3}}>{range}</div>
                      <div style={{fontSize:13,fontWeight:600,color:c.t2,marginBottom:4}}>{label}</div>
                      <div style={{fontSize:12,color:c.t3,lineHeight:1.55}}>{desc}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <StatsSidebar dark={dark}/>
          </div>
        )}

        {/* All Results tab */}
        {tab==='all'&&(
          <div className="fade-up" style={{display:'flex',gap:24,alignItems:'flex-start'}}>
            <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:16}}>
              {COMP.categories.map((cat,i)=>(
                <CategorySection key={cat} cat={cat} entries={ALL_ENTRIES[cat]||[]} dark={dark} defaultOpen={i===0}/>
              ))}
            </div>
            <StatsSidebar dark={dark}/>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Nav + App ─────────────────────────────────────────────────────────────────
function Nav({dark,setDark}){
  const c=dark?T.d:T.l;
  return(
    <div style={{background:dark?'#1C1C1C':'#fff',borderBottom:`1px solid ${c.bd}`,boxShadow:dark?'none':'0 1px 8px rgba(0,0,0,0.07)',display:'flex',alignItems:'center',padding:'0 24px',height:54,flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',gap:9,marginRight:32,userSelect:'none'}}>
        <div style={{width:30,height:30,borderRadius:8,background:dark?'rgba(74,144,212,0.15)':'rgba(26,111,196,0.10)',display:'flex',alignItems:'center',justifyContent:'center'}}><ApertureIcon size={18} color={c.ac}/></div>
        <span style={{fontSize:15,fontWeight:700,color:c.t1,letterSpacing:'-0.01em',fontFamily:T.lora}}>Nashoba Valley Photo Club</span>
      </div>
      <div style={{display:'flex',gap:2,flex:1}}>
        {[['home','Home','home'],['cal','Calendar','cal'],['img','My Images','img'],['trophy','Competitions','trophy']].map(([id,lbl,icon],idx)=>{
          const active=idx===3;
          return(<button key={id} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',borderRadius:8,border:'none',cursor:'pointer',fontFamily:T.nu,background:active?(dark?'rgba(74,144,212,0.14)':'rgba(26,111,196,0.09)'):'transparent',color:active?c.ac:c.t2,fontSize:14,fontWeight:active?700:500}}>
            <Icon n={icon} size={15} color={active?c.ac:dark?T.d.t3:'#888'}/>{lbl}
          </button>);
        })}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <button onClick={()=>setDark(d=>!d)} style={{display:'flex',alignItems:'center',gap:6,background:'transparent',border:`1px solid ${c.bd}`,borderRadius:8,padding:'6px 12px',cursor:'pointer',color:c.t2,fontSize:13,fontFamily:T.nu}}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={c.t2} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            {dark?<><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>:<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>}
          </svg>
          {dark?'Light':'Dark'}
        </button>
        <div style={{width:34,height:34,borderRadius:'50%',background:c.ac,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:13,fontWeight:700,fontFamily:T.nu}}>DB</div>
      </div>
    </div>
  );
}

function App(){
  const [dark,setDark]=React.useState(true);
  const [tweaks,setTweaks]=React.useState(false);
  const c=dark?T.d:T.l;

  React.useEffect(()=>{
    const h=e=>{
      if(e.data?.type==='__activate_edit_mode') setTweaks(true);
      if(e.data?.type==='__deactivate_edit_mode') setTweaks(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',h);
  },[]);

  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <Nav dark={dark} setDark={setDark}/>
      <ResultsPage dark={dark} onBack={()=>{}}/>
      {tweaks&&(
        <div style={{position:'fixed',bottom:20,right:20,background:dark?T.d.s1:'#fff',border:`1px solid ${c.bd}`,borderRadius:12,padding:20,width:200,boxShadow:'0 8px 32px rgba(0,0,0,0.3)',zIndex:9999,fontFamily:T.nu,display:'flex',flexDirection:'column',gap:12}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.07em',textTransform:'uppercase',color:c.t2}}>Tweaks</div>
          <label style={{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}>
            <span style={{fontSize:14,color:c.t1}}>Dark mode</span>
            <input type="checkbox" checked={dark} onChange={e=>setDark(e.target.checked)}/>
          </label>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
